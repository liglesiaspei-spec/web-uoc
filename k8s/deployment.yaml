apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-uoc-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-uoc
  template:
    metadata:
      labels:
        app: web-uoc
    spec:
      containers:
      - name: web-uoc
        image: luisi333/web-uoc:1.0
        ports:
        - containerPort: 8080
